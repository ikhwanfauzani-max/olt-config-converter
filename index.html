<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huawei OLT Converter - Grid Output</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .input-label { @apply block text-xs font-bold mb-1 uppercase tracking-wider; }
        .text-box { @apply w-full bg-slate-800 border border-slate-700 rounded p-2 font-mono text-[10px] outline-none focus:border-sky-500 text-slate-200; }
        .result-box { @apply w-full bg-slate-900 border border-emerald-900/50 rounded p-2 font-mono text-[10px] text-emerald-400 h-64 overflow-y-auto whitespace-pre; }
    </style>
</head>
<body class="bg-slate-950 p-4">
    <div class="max-w-[95%] mx-auto">
        <h1 class="text-xl font-bold text-sky-400 mb-6 border-b border-slate-800 pb-2">HUAWEI REHOMING GENERATOR (WEB VERSION)</h1>

        <div class="grid grid-cols-1 md:grid-cols-7 gap-3 mb-6">
            <div class="col-span-1">
                <label class="input-label text-sky-300">Tcont Profile</label>
                <textarea id="in_tcont" rows="8" class="text-box"></textarea>
            </div>
            <div class="col-span-1">
                <label class="input-label text-sky-300">Traffic Profile</label>
                <textarea id="in_traffic" rows="8" class="text-box"></textarea>
            </div>
            <div class="col-span-1">
                <label class="input-label text-sky-300">Service Profile</label>
                <textarea id="in_srv" rows="8" class="text-box"></textarea>
            </div>
            <div class="col-span-1">
                <label class="input-label text-sky-300">Line Profile</label>
                <textarea id="in_line" rows="8" class="text-box"></textarea>
            </div>
            <div class="col-span-1">
                <label class="input-label text-yellow-400">Interface GPON</label>
                <textarea id="in_if" rows="8" class="text-box"></textarea>
            </div>
            <div class="col-span-1">
                <label class="input-label text-orange-400">Service Port</label>
                <textarea id="in_sp" rows="8" class="text-box"></textarea>
            </div>
            <div class="col-span-1">
                <label class="input-label text-pink-400">New PON</label>
                <input id="in_newpon" type="text" class="text-box mb-2" placeholder="F/S/P">
                <button onclick="processData()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-4 rounded transition-all">GENERATE</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 border-t border-slate-800 pt-6">
            <div>
                <label class="input-label text-emerald-500 text-center">service_profile_result</label>
                <div id="res_srv" class="result-box"></div>
                <button onclick="copyToClipboard('res_srv')" class="text-[10px] text-slate-500 mt-1 underline">Copy Column</button>
            </div>
            <div>
                <label class="input-label text-emerald-500 text-center">line_profile_result</label>
                <div id="res_line" class="result-box"></div>
                <button onclick="copyToClipboard('res_line')" class="text-[10px] text-slate-500 mt-1 underline">Copy Column</button>
            </div>
            <div>
                <label class="input-label text-emerald-500 text-center">interface_gpon_result</label>
                <div id="res_if" class="result-box"></div>
                <button onclick="copyToClipboard('res_if')" class="text-[10px] text-slate-500 mt-1 underline">Copy Column</button>
            </div>
            <div>
                <label class="input-label text-emerald-500 text-center">service_port_result</label>
                <div id="res_sp" class="result-box"></div>
                <button onclick="copyToClipboard('res_sp')" class="text-[10px] text-slate-500 mt-1 underline">Copy Column</button>
            </div>
        </div>
    </div>

    <script>
        function processData() {
            const inputs = {
                tcont: document.getElementById('in_tcont').value.split('\n'),
                traffic: document.getElementById('in_traffic').value.split('\n'),
                srv: document.getElementById('in_srv').value.split('\n'),
                line: document.getElementById('in_line').value.split('\n'),
                ifGpon: document.getElementById('in_if').value.split('\n'),
                sp: document.getElementById('in_sp').value.split('\n'),
                newPon: document.getElementById('in_newpon').value.trim()
            };

            if (!inputs.newPon) return alert("Isi New PON!");

            let dbaMap = {}, srvMap = {}, lineMap = {}, trafficMap = {};
            
            // Build Maps (Global)
            [...inputs.tcont, ...inputs.line].forEach(t => extractMap(t, dbaMap));
            inputs.traffic.forEach(t => extractMap(t, trafficMap, true));
            inputs.srv.forEach(t => extractMap(t, srvMap));
            inputs.line.forEach(t => extractMap(t, lineMap));

            const [f, s, p] = inputs.newPon.split('/');
            const newFS = `${f}/${s}`;

            // Process Each Column (Result)
            const resSrv = inputs.srv.map(t => t.replace(/(ont-srvprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 '));
            
            const resLine = inputs.line.map(t => {
                let txt = t.replace(/(ont-lineprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ');
                return txt.replace(/dba-profile-id\s+(\d+)/g, (m, id) => `dba-profile-name ${dbaMap[id] || id}`);
            });

            const resIf = inputs.ifGpon.map(t => {
                let txt = t.replace(/interface gpon \d+\/\d+/g, `interface gpon ${newFS}`);
                txt = txt.replace(/\bport\s+\d+\b/g, `port ${p}`);
                txt = txt.replace(/ont (add|ipconfig|tr069-server-config) \d+/g, `ont $1 ${p}`);
                txt = txt.replace(/ont port ([a-z\-]+) \d+/g, `ont port $1 ${p}`);
                txt = txt.replace(/\d+\/\d+\/\d+:/g, `${inputs.newPon}:`);
                txt = txt.replace(/ont-lineprofile-id\s+(\d+)/g, (m, id) => `ont-lineprofile-name ${lineMap[id] || id}`);
                txt = txt.replace(/ont-srvprofile-id\s+(\d+)/g, (m, id) => `ont-srvprofile-name ${srvMap[id] || id}`);
                return txt;
            });

            const resSp = inputs.sp.map(t => {
                let txt = t.replace(/service-port\s+\d+/g, 'service-port');
                txt = txt.replace(/gpon\s+\d+\/\d+\/\d+/g, `gpon ${inputs.newPon}`);
                txt = txt.replace(/traffic-table index\s+(\d+)/g, (m, id) => `traffic-table name ${trafficMap[id] || id}`);
                txt = txt.replace(/port desc \d+\/\d+\/\d+/g, `port desc ${inputs.newPon}`);
                txt = txt.replace(/description\s+"(\d+\/\d+\/\d+)_/g, `description "${inputs.newPon}_`);
                return txt;
            });

            // Update UI
            document.getElementById('res_srv').textContent = resSrv.join('\n');
            document.getElementById('res_line').textContent = resLine.join('\n');
            document.getElementById('res_if').textContent = resIf.join('\n');
            document.getElementById('res_sp').textContent = resSp.join('\n');
        }

        function extractMap(text, mapObj, isTraffic = false) {
            if (!text) return;
            const regex = isTraffic ? /ip index\s+(\d+).*?name\s+"([^"]+)"/g : /profile-id\s+(\d+).*?profile-name\s+"([^"]+)"/g;
            let match;
            while ((match = regex.exec(text)) !== null) { mapObj[match[1]] = match[2]; }
        }

        function copyToClipboard(id) {
            const text = document.getElementById(id).textContent;
            navigator.clipboard.writeText(text).then(() => alert("Column Copied!"));
        }
    </script>
</body>
</html>
