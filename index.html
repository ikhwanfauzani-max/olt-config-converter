<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huawei OLT Converter - Soft Elegant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Menggunakan font mono yang sama untuk semua kolom */
        .column-text { 
            @apply w-full font-mono text-[6px] leading-[1] outline-none text-slate-800 p-1.5 transition-all;
        }
        
        /* Label Kolom: Ukuran 10px, Bold, Warna Soft */
        .column-label { 
            @apply block text-[10px] font-bold mb-1 uppercase text-slate-600 tracking-wider text-center; 
        }

        /* Border yang dipertegas untuk Input dan Output */
        .border-strong { 
            @apply border-2 border-slate-300 focus:border-blue-400 rounded-md shadow-sm; 
        }

        /* Container Output */
        .output-box { 
            @apply bg-white border-2 border-slate-300 rounded-md overflow-hidden flex flex-col; 
        }

        .result-area { 
            @apply w-full h-[550px] overflow-both whitespace-pre bg-slate-50/50; 
        }
    </style>
</head>
<body class="bg-[#f0f4f8] p-4">
    <div class="max-w-[100%] mx-auto">
        <div class="flex justify-between items-center mb-6 border-b-2 border-slate-300 pb-2">
            <h1 class="text-sm font-bold text-slate-700 uppercase tracking-widest">Huawei Rehoming Generator</h1>
            <span class="text-[9px] text-slate-500 font-medium">Versi Soft Elegant • Nano Text 6px</span>
        </div>

        <div class="grid grid-cols-7 gap-3 mb-8">
            <div class="flex flex-col">
                <label class="column-label">Tcont</label>
                <textarea id="in_tcont" class="column-text border-strong h-24 bg-white"></textarea>
            </div>
            <div class="flex flex-col">
                <label class="column-label">Traffic</label>
                <textarea id="in_traffic" class="column-text border-strong h-24 bg-white"></textarea>
            </div>
            <div class="flex flex-col">
                <label class="column-label">Srv Prof</label>
                <textarea id="in_srv" class="column-text border-strong h-24 bg-white"></textarea>
            </div>
            <div class="flex flex-col">
                <label class="column-label">Line Prof</label>
                <textarea id="in_line" class="column-text border-strong h-24 bg-white"></textarea>
            </div>
            <div class="flex flex-col">
                <label class="column-label text-blue-600">Interface</label>
                <textarea id="in_if" class="column-text border-strong h-24 bg-white"></textarea>
            </div>
            <div class="flex flex-col">
                <label class="column-label text-blue-600">Srv Port</label>
                <textarea id="in_sp" class="column-text border-strong h-24 bg-white"></textarea>
            </div>
            <div class="flex flex-col">
                <label class="column-label text-rose-600">New PON</label>
                <input id="in_newpon" type="text" class="column-text border-strong mb-2 bg-white" placeholder="0/2/2">
                <button onclick="processData()" class="w-full bg-slate-700 hover:bg-blue-600 text-white font-bold py-2 rounded shadow transition-all uppercase text-[9px] mt-auto">Generate</button>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-3">
            <div class="output-box">
                <div class="flex justify-between items-center bg-slate-200 px-2 py-1 border-b-2 border-slate-300">
                    <span class="column-label mb-0 text-slate-700">srv_prof_res</span>
                    <button onclick="copyCol('res_srv')" class="bg-white hover:bg-blue-500 hover:text-white text-slate-700 text-[8px] px-2 py-0.5 rounded border border-slate-300 font-bold transition-all">COPY</button>
                </div>
                <div id="res_srv" class="result-area column-text p-2 text-slate-800"></div>
            </div>

            <div class="output-box">
                <div class="flex justify-between items-center bg-slate-200 px-2 py-1 border-b-2 border-slate-300">
                    <span class="column-label mb-0 text-slate-700">line_prof_res</span>
                    <button onclick="copyCol('res_line')" class="bg-white hover:bg-blue-500 hover:text-white text-slate-700 text-[8px] px-2 py-0.5 rounded border border-slate-300 font-bold transition-all">COPY</button>
                </div>
                <div id="res_line" class="result-area column-text p-2 text-slate-800"></div>
            </div>

            <div class="output-box">
                <div class="flex justify-between items-center bg-slate-200 px-2 py-1 border-b-2 border-slate-300">
                    <span class="column-label mb-0 text-slate-700">int_gpon_res</span>
                    <button onclick="copyCol('res_if')" class="bg-white hover:bg-blue-500 hover:text-white text-slate-700 text-[8px] px-2 py-0.5 rounded border border-slate-300 font-bold transition-all">COPY</button>
                </div>
                <div id="res_if" class="result-area column-text p-2 text-slate-800"></div>
            </div>

            <div class="output-box">
                <div class="flex justify-between items-center bg-slate-200 px-2 py-1 border-b-2 border-slate-300">
                    <span class="column-label mb-0 text-slate-700">srv_port_res</span>
                    <button onclick="copyCol('res_sp')" class="bg-white hover:bg-blue-500 hover:text-white text-slate-700 text-[8px] px-2 py-0.5 rounded border border-slate-300 font-bold transition-all">COPY</button>
                </div>
                <div id="res_sp" class="result-area column-text p-2 text-slate-800"></div>
            </div>
        </div>
    </div>

    <script>
        function extractMap(text, mapObj, isTraffic = false) {
            if (!text) return;
            const regex = isTraffic ? /ip index\s+(\d+).*?name\s+"([^"]+)"/g : /profile-id\s+(\d+).*?profile-name\s+"([^"]+)"/g;
            let match;
            while ((match = regex.exec(text)) !== null) { mapObj[match[1]] = match[2]; }
        }

        function processData() {
            try {
                const newPon = document.getElementById('in_newpon').value.trim();
                if (!newPon.includes('/')) return alert("Format PON salah!");
                const [f, s, p] = newPon.split('/');
                const newFS = `${f}/${s}`;

                const getLines = (id) => document.getElementById(id).value.split('\n');
                const rawTcont = getLines('in_tcont');
                const rawTraffic = getLines('in_traffic');
                const rawSrv = getLines('in_srv');
                const rawLine = getLines('in_line');
                const rawIf = getLines('in_if');
                const rawSp = getLines('in_sp');

                let dbaMap = {}, srvMap = {}, lineMap = {}, trafficMap = {};
                rawTcont.forEach(l => extractMap(l, dbaMap));
                rawTraffic.forEach(l => extractMap(l, trafficMap, true));
                rawSrv.forEach(l => extractMap(l, srvMap));
                rawLine.forEach(l => extractMap(l, lineMap));

                document.getElementById('res_srv').textContent = rawSrv.map(t => t.trim() ? t.replace(/(ont-srvprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ') : "").join('\n');
                document.getElementById('res_line').textContent = rawLine.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/(ont-lineprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ');
                    return txt.replace(/dba-profile-id\s+(\d+)/g, (m, id) => `dba-profile-name ${dbaMap[id] || id}`);
                }).join('\n');
                document.getElementById('res_if').textContent = rawIf.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/interface gpon \d+\/\d+/g, `interface gpon ${newFS}`).replace(/\bport\s+\d+\b/g, `port ${p}`);
                    txt = txt.replace(/ont (add|ipconfig|tr069-server-config) \d+/g, `ont $1 ${p}`).replace(/ont port ([a-z\-]+) \d+/g, `ont port $1 ${p}`);
                    txt = txt.replace(/\d+\/\d+\/\d+:/g, `${newPon}:`).replace(/ont-lineprofile-id\s+(\d+)/g, (m, id) => `ont-lineprofile-name ${lineMap[id] || id}`);
                    return txt.replace(/ont-srvprofile-id\s+(\d+)/g, (m, id) => `ont-srvprofile-name ${srvMap[id] || id}`);
                }).join('\n');
                document.getElementById('res_sp').textContent = rawSp.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/service-port\s+\d+/g, 'service-port').replace(/gpon\s+\d+\/\d+\/\d+/g, `gpon ${newPon}`);
                    txt = txt.replace(/traffic-table index\s+(\d+)/g, (m, id) => `traffic-table name ${trafficMap[id] || id}`);
                    return txt.replace(/port desc \d+\/\d+\/\d+/g, `port desc ${newPon}`).replace(/description\s+"(\d+\/\d+\/\d+)_/g, `description "${newPon}_`);
                }).join('\n');
                alert("Berhasil!");
            } catch (e) { alert("Error!"); }
        }

        function copyCol(id) {
            const text = document.getElementById(id).textContent;
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => alert("Copied!"));
        }
    </script>
</body>
</html>
