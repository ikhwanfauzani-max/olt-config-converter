<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLT Huawei Rehoming PON Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .mono-font { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-weight: 600; }
        
        /* JUDUL UTAMA: Ketebalan diturunkan ke Semibold */
        .main-title { @apply text-xl font-semibold text-slate-900 uppercase tracking-wide; }
        .section-title { @apply text-[15px] font-semibold uppercase tracking-wider; }

        /* Input Styling */
        .column-text { @apply w-full text-[10px] leading-[1.3] outline-none p-2 transition-all mono-font border-2 border-slate-900 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]; }
        .column-label { @apply block text-[11px] font-bold mb-1 text-slate-700 text-center uppercase; }
        
        /* BAR OUTPUT: ORANGE KUNYIT (HIGH CONTRAST) */
        .output-header {
            background-color: #f59e0b; /* Amber-500 (Lebih tajam dari sebelumnya) */
            @apply px-4 py-2 flex justify-between items-center border-b-2 border-slate-900;
        }

        /* TEKS 01, 02, 03: HITAM PEKAT BOLD */
        .output-title {
            color: #000000 !important; 
            @apply text-[12px] font-bold tracking-tight uppercase;
        }

        /* TOMBOL COPY: BIRU TERANG + EFEK FISIK */
        .btn-copy {
            background-color: #0ea5e9; /* Sky-500 */
            @apply text-white text-[10px] px-4 py-1 font-black border-2 border-slate-900 transition-all uppercase;
            box-shadow: 2px 2px 0px 0px #000000;
            margin-left: 10px;
        }
        .btn-copy:active {
            box-shadow: 0px 0px 0px 0px #000000;
            transform: translate(1px, 1px);
        }
        .btn-copy:hover { @apply bg-sky-600; }

        .output-card { @apply bg-white border-2 border-slate-900 flex flex-col min-h-[500px] shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]; }
        .result-area { @apply flex-grow overflow-both whitespace-pre p-3 text-slate-900 font-bold bg-white; font-family: 'Consolas', monospace; font-size: 11px; }
        
        .reminder-box { background-color: #fefce8; @apply mb-6 border-l-8 border-amber-500 p-4 border-2 border-slate-900 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]; }
    </style>
</head>
<body class="bg-[#f8fafc] p-8">
    <div class="max-w-[100%] mx-auto">
        
        <div class="flex justify-between items-center mb-8 border-b-2 border-slate-300 pb-4">
            <h1 class="main-title">Olt Huawei <span class="text-red-600">Rehoming Tools</span></h1>
            <div class="text-[10px] font-bold text-slate-400">V.2.1 | HIGH CONTRAST MODE</div>
        </div>

        <div class="reminder-box">
            <p class="text-xs font-bold text-amber-900 italic">
                ⚠️ REMINDER: PASTIKAN VLAN OLT BEFORE SUDAH DI CREATE DI OLT AFTER SEBELUM EKSEKUSI!
            </p>
        </div>

        <div class="mb-4 flex items-center gap-2">
            <div class="w-2 h-6 bg-red-600"></div>
            <h2 class="section-title text-red-600">Input data dari Olt Before :</h2>
        </div>

        <div class="grid grid-cols-6 gap-4 mb-10">
            <div class="flex flex-col">
                <label class="column-label">01. dba-profile</label>
                <textarea id="in_tcont" class="column-text h-44 bg-white" placeholder="Paste dba-profile"></textarea>
            </div>
            <div class="flex flex-col">
                <label class="column-label">02. traffic_table</label>
                <textarea id="in_traffic" class="column-text h-44 bg-white" placeholder="Paste traffic table"></textarea>
            </div>
            <div class="flex flex-col">
                <label class="column-label">03. ont-srvprofile</label>
                <textarea id="in_srv" class="column-text h-44 bg-white" placeholder="Paste ont-srvprofile"></textarea>
            </div>
            <div class="flex flex-col">
                <label class="column-label">04. ont-lineprofile</label>
                <textarea id="in_line" class="column-text h-44 bg-white" placeholder="Paste ont-lineprofile"></textarea>
            </div>
            <div class="flex flex-col">
                <label class="column-label">05. interface_gpon</label>
                <textarea id="in_combined" class="column-text h-44 bg-white" placeholder='display current-conf port x/x/x'></textarea>
            </div>
            <div class="flex flex-col justify-end">
                <div class="bg-slate-900 p-4 border-2 border-slate-900 shadow-[4px_4px_0px_0px_rgba(15,23,42,0.3)]">
                    <label class="block text-[10px] font-bold text-white mb-2 text-center">NEW PON (F/S/P)</label>
                    <input id="in_newpon" type="text" class="w-full font-black text-[12px] p-2 mb-3 text-center outline-none border-2 border-white" placeholder="0/2/2">
                    <button onclick="processData()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 text-[11px] tracking-widest transition-all uppercase">Generate</button>
                </div>
            </div>
        </div>

        <div class="mb-4 flex items-center gap-2">
            <div class="w-2 h-6 bg-slate-900"></div>
            <h2 class="section-title text-slate-900">Output data untuk Olt After :</h2>
        </div>

        <div class="grid grid-cols-3 gap-6">
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">01. output ont-srvprofile</span>
                    <button onclick="copyCol('res_srv')" class="btn-copy">COPY</button>
                </div>
                <div id="res_srv" class="result-area"></div>
            </div>
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">02. output ont-lineprofile</span>
                    <button onclick="copyCol('res_line')" class="btn-copy">COPY</button>
                </div>
                <div id="res_line" class="result-area"></div>
            </div>
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">03. output interface_gpon</span>
                    <button onclick="copyCol('res_merged')" class="btn-copy">COPY</button>
                </div>
                <div id="res_merged" class="result-area"></div>
            </div>
        </div>
    </div>

    <script>
        // Logika script sama seperti sebelumnya (Stabil)
        function extractMap(text, mapObj, isTraffic = false) {
            if (!text) return;
            const regex = isTraffic ? /ip index\s+(\d+).*?name\s+"([^"]+)"/g : /profile-id\s+(\d+).*?profile-name\s+"([^"]+)"/g;
            let match;
            while ((match = regex.exec(text)) !== null) { mapObj[match[1]] = match[2]; }
        }
        function processData() {
            try {
                const newPon = document.getElementById('in_newpon').value.trim();
                if (!newPon.includes('/')) return alert("Format PON salah!");
                const [f, s, p] = newPon.split('/');
                const newFS = `${f}/${s}`;
                const rawTcont = document.getElementById('in_tcont').value.split('\n');
                const rawTraffic = document.getElementById('in_traffic').value.split('\n');
                const rawSrv = document.getElementById('in_srv').value.split('\n');
                const rawLine = document.getElementById('in_line').value.split('\n');
                const combinedData = document.getElementById('in_combined').value.split('\n');
                let dbaMap = {}, srvMap = {}, lineMap = {}, trafficMap = {};
                rawTcont.forEach(l => extractMap(l, dbaMap));
                rawTraffic.forEach(l => extractMap(l, trafficMap, true));
                rawSrv.forEach(l => extractMap(l, srvMap));
                rawLine.forEach(l => extractMap(l, lineMap));
                let srvLines = rawSrv.map(t => t.trim() ? t.replace(/(ont-srvprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ') : "").filter(l => l !== "");
                let finalSrv = [];
                srvLines.forEach(line => { finalSrv.push(line); if(line.toLowerCase().includes("commit")) finalSrv.push(" quit"); });
                document.getElementById('res_srv').textContent = finalSrv.join('\n');
                document.getElementById('res_line').textContent = rawLine.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/(ont-lineprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ');
                    return txt.replace(/dba-profile-id\s+(\d+)/g, (m, id) => `dba-profile-name ${dbaMap[id] || id}`);
                }).join('\n');
                let lastOntPortIndex = -1;
                const outIfLines = combinedData.filter(l => {
                    const line = l.trim();
                    return (line.startsWith('interface gpon') || line.startsWith('ont ') || (line.startsWith('port ') && !line.includes('desc')) || line.startsWith('ont-lineprofile') || line.startsWith('ont-srvprofile')) && !line.includes('service-port');
                }).map(t => {
                    let txt = t.replace(/interface gpon \d+\/\d+/g, `interface gpon ${newFS}`).replace(/\bport\s+\d+\b/g, `port ${p}`);
                    txt = txt.replace(/ont (add|ipconfig|tr069-server-config|wan-config) \d+/g, `ont $1 ${p}`);
                    txt = txt.replace(/ont port ([a-z\-]+) \d+/g, `ont port $1 ${p}`);
                    txt = txt.replace(/\d+\/\d+\/\d+:/g, `${newPon}:`).replace(/ont-lineprofile-id\s+(\d+)/g, (m, id) => `ont-lineprofile-name ${lineMap[id] || id}`);
                    return txt.replace(/ont-srvprofile-id\s+(\d+)/g, (m, id) => `ont-srvprofile-name ${srvMap[id] || id}`);
                });
                for(let i = outIfLines.length - 1; i >= 0; i--) { if(outIfLines[i].includes('ont port')) { lastOntPortIndex = i; break; } }
                if(lastOntPortIndex !== -1) outIfLines.splice(lastOntPortIndex + 1, 0, " quit");
                const outSpAndDesc = combinedData.filter(l => l.includes('service-port') || l.includes('port') && l.includes('desc')).map(t => {
                    let txt = t.trim(); if(!txt) return "";
                    txt = txt.replace(/service-port\s+\d+/g, 'service-port').replace(/gpon\s+\d+\/\d+\/\d+/g, `gpon ${newPon}`);
                    txt = txt.replace(/traffic-table index\s+(\d+)/g, (m, id) => `traffic-table name ${trafficMap[id] || id}`);
                    txt = txt.replace(/port\s+desc\s+\d+\/\d+\/\d+/g, `port desc ${newPon}`);
                    txt = txt.replace(/description\s+"(\d+\/\d+\/\d+)_/g, `description "${newPon}_`);
                    return txt;
                }).filter(l => l !== "");
                document.getElementById('res_merged').textContent = (outIfLines.join('\n').trim() + "\n\n" + outSpAndDesc.join('\n').trim()).trim();
                alert("Generator Berhasil!");
            } catch (e) { alert("Kesalahan input!"); }
        }
        function copyCol(id) {
            const text = document.getElementById(id).textContent;
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'COPIED!';
                btn.style.backgroundColor = '#22c55e';
                setTimeout(() => { 
                    btn.textContent = originalText; 
                    btn.style.backgroundColor = '#0ea5e9'; 
                }, 800);
            });
        }
    </script>
</body>
</html>
