<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huawei OLT Converter - Multi Column</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-200 p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-bold text-sky-400">Huawei Config Converter (Manual Column)</h1>
            <p class="text-slate-400 text-sm">Isi setiap kolom di bawah ini dengan data dari Excel.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="space-y-4 col-span-1">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-sky-300">Tcont Profile</label>
                    <textarea id="in_tcont" rows="4" class="w-full bg-slate-800 border border-slate-700 rounded p-2 font-mono text-[10px] outline-none focus:border-sky-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-sky-300">Traffic Profile</label>
                    <textarea id="in_traffic" rows="4" class="w-full bg-slate-800 border border-slate-700 rounded p-2 font-mono text-[10px] outline-none focus:border-sky-500"></textarea>
                </div>
            </div>

            <div class="space-y-4 col-span-1">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-sky-300">Service Profile</label>
                    <textarea id="in_srv" rows="4" class="w-full bg-slate-800 border border-slate-700 rounded p-2 font-mono text-[10px] outline-none focus:border-sky-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-sky-300">Line Profile</label>
                    <textarea id="in_line" rows="4" class="w-full bg-slate-800 border border-slate-700 rounded p-2 font-mono text-[10px] outline-none focus:border-sky-500"></textarea>
                </div>
            </div>

            <div class="space-y-4 col-span-2">
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold mb-1 text-yellow-400">Interface GPON</label>
                        <textarea id="in_if" rows="6" class="w-full bg-slate-800 border border-slate-700 rounded p-2 font-mono text-[10px] outline-none focus:border-yellow-500"></textarea>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-semibold mb-1 text-orange-400">Service Port</label>
                        <textarea id="in_sp" rows="6" class="w-full bg-slate-800 border border-slate-700 rounded p-2 font-mono text-[10px] outline-none focus:border-orange-500"></textarea>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-pink-400">New PON (Satu baris saja, misal: 0/1/9)</label>
                    <input id="in_newpon" type="text" class="w-full bg-slate-800 border border-slate-700 rounded p-2 font-mono text-sm outline-none focus:border-pink-500" placeholder="F/S/P">
                </div>
                <button onclick="processData()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded shadow-lg transition-all">
                    CONVERT SEKARANG
                </button>
            </div>
        </div>

        <div class="mt-4">
            <label class="block text-sm font-semibold mb-2 text-emerald-400">Hasil Konversi:</label>
            <textarea id="finalResult" rows="15" class="w-full bg-slate-800 border border-emerald-900/30 rounded p-4 font-mono text-xs text-emerald-400" readonly></textarea>
            <button onclick="copyToClipboard()" class="mt-2 text-xs text-slate-500 hover:text-slate-300 underline font-bold">Copy Result</button>
        </div>
    </div>

    <script>
        function processData() {
            // Ambil Value
            const tcontRaw = document.getElementById('in_tcont').value;
            const trafficRaw = document.getElementById('in_traffic').value;
            const srvRaw = document.getElementById('in_srv').value;
            const lineRaw = document.getElementById('in_line').value;
            const ifRaw = document.getElementById('in_if').value;
            const spRaw = document.getElementById('in_sp').value;
            const newPon = document.getElementById('in_newpon').value.trim();

            if (!newPon) return alert("Isi New PON dulu!");

            let dbaMap = {}, srvMap = {}, lineMap = {}, trafficMap = {};

            // Build Maps dari kolom masing-masing
            extractMap(tcontRaw, dbaMap);
            extractMap(trafficRaw, trafficMap, true);
            extractMap(srvRaw, srvMap);
            extractMap(lineRaw, lineMap);

            // Logika Konversi (Sama seperti Python)
            const [f, s, p] = newPon.split('/');
            const newFS = `${f}/${s}`;

            let result = `! --- CONFIG GENERATED FOR ${newPon} ---\n`;

            // 1. Service Profile
            result += srvRaw.replace(/(ont-srvprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ') + "\n";

            // 2. Line Profile
            let lineRes = lineRaw.replace(/(ont-lineprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ');
            lineRes = lineRes.replace(/dba-profile-id\s+(\d+)/g, (m, id) => `dba-profile-name ${dbaMap[id] || id}`);
            result += lineRes + "\n";

            // 3. Interface GPON
            let ifLines = ifRaw.split('\n').map(line => {
                let text = line;
                text = text.replace(/interface gpon \d+\/\d+/g, `interface gpon ${newFS}`);
                text = text.replace(/\bport\s+\d+\b/g, `port ${p}`);
                text = text.replace(/ont (add|ipconfig|tr069-server-config) \d+/g, `ont $1 ${p}`);
                text = text.replace(/ont port ([a-z\-]+) \d+/g, `ont port $1 ${p}`);
                text = text.replace(/\d+\/\d+\/\d+:/g, `${newPon}:`);
                text = text.replace(/ont-lineprofile-id\s+(\d+)/g, (m, id) => `ont-lineprofile-name ${lineMap[id] || id}`);
                text = text.replace(/ont-srvprofile-id\s+(\d+)/g, (m, id) => `ont-srvprofile-name ${srvMap[id] || id}`);
                return text;
            });
            result += ifLines.join('\n') + "\n";

            // 4. Service Port
            let spLines = spRaw.split('\n').map(line => {
                let text = line;
                text = text.replace(/service-port\s+\d+/g, 'service-port');
                text = text.replace(/gpon\s+\d+\/\d+\/\d+/g, `gpon ${newPon}`);
                text = text.replace(/traffic-table index\s+(\d+)/g, (m, id) => `traffic-table name ${trafficMap[id] || id}`);
                text = text.replace(/port desc \d+\/\d+\/\d+/g, `port desc ${newPon}`);
                text = text.replace(/description\s+"(\d+\/\d+\/\d+)_/g, `description "${newPon}_`);
                return text;
            });
            result += spLines.join('\n');

            document.getElementById('finalResult').value = result;
        }

        function extractMap(text, mapObj, isTraffic = false) {
            if (!text) return;
            const regex = isTraffic ? /ip index\s+(\d+).*?name\s+"([^"]+)"/g : /profile-id\s+(\d+).*?profile-name\s+"([^"]+)"/g;
            let match;
            while ((match = regex.exec(text)) !== null) { mapObj[match[1]] = match[2]; }
        }

        function copyToClipboard() {
            const el = document.getElementById('finalResult');
            el.select();
            document.execCommand('copy');
            alert("Hasil disalin!");
        }
    </script>
</body>
</html>
