<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLT Huawei Rehoming PON Tools</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body { font-family: 'Segoe UI', sans-serif; }

.mono-font { 
    font-family: 'Consolas','Courier New',monospace;
    font-weight:500;
}

.column-text{
    width:100%;
    font-size:10px;
    line-height:1.3;
    padding:8px;
    font-family:'Consolas','Courier New',monospace;
    font-weight:500;
}

.column-label{
    display:block;
    font-size:14px;
    font-weight:700;
    text-align:center;
    margin-bottom:6px;
    color:#1e293b;
    background:#efe1cf;
    padding:6px 8px;
    border-left:4px solid #a16207;
    border-radius:4px;
}

.border-heavy{
    border:2px solid #000;
}

.output-card{
    background:#fff;
    border:2px solid #000;
    display:flex;
    flex-direction:column;
    min-height:500px;
    box-shadow:4px 4px 0 #000;
}

.output-header{
    background:rgba(59,130,246,0.15);
    padding:6px 8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-left:4px solid #3b82f6;
    border-bottom:1px solid #93c5fd;
}

.output-title{
    font-size:14px;
    font-weight:700;
    color:#1e3a8a;
}

.result-area{
    flex-grow:1;
    overflow:auto;
    white-space:pre;
    padding:8px;
    font-size:10px;
    background:#e0f2fe;
    font-family:'Consolas','Courier New',monospace;
}

/* ===== BUTTON BASE ===== */

.btn-copy-custom,
.btn-clear-col{
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:4px;
    cursor:pointer;
    transition:all .3s ease;
}

/* COPY */
.btn-copy-custom{
    background:#3b82f6;
    border:1px solid #2563eb;
    color:#fff;
}
.btn-copy-custom:hover{
    background:#2563eb;
    transform:translateY(-1px);
}

/* CLEAR */
.btn-clear-col{
    margin-top:6px;
    width:100%;
    background:#e2e8f0;
    border:1px solid #475569;
    color:#1e293b;
}
.btn-clear-col:hover{
    background:#cbd5e1;
    transform:translateY(-1px);
}

/* SUCCESS EFFECT */
.success{
    background:#16a34a !important;
    border-color:#15803d !important;
    color:#fff !important;
    opacity:0;
    animation:fadeIn .25s forwards;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

.reminder-box{
    background:#dbeafe;
    border-left:8px solid #2563eb;
    border:2px solid #000;
    padding:16px;
    margin-bottom:24px;
    box-shadow:4px 4px 0 #000;
}
</style>
</head>

<body class="bg-[#f0f2f5] p-6">

<div class="max-w-full mx-auto">

<h1 class="text-2xl font-bold mb-6">Olt Huawei <span class="text-red-600">Rehoming Tools</span></h1>

<div class="reminder-box">
Reminder: Pastikan VLAN OLT BEFORE sudah dibuat di OLT AFTER
</div>

<h2 class="font-bold mb-4">Input data dari OLT Before:</h2>

<div class="grid grid-cols-6 gap-4 mb-8">

<div>
<label class="column-label">01. dba-profile</label>
<textarea id="in_tcont" class="column-text border-heavy h-48"></textarea>
<button onclick="clearField('in_tcont',this)" class="btn-clear-col">Clear</button>
</div>

<div>
<label class="column-label">02. traffic_table</label>
<textarea id="in_traffic" class="column-text border-heavy h-48"></textarea>
<button onclick="clearField('in_traffic',this)" class="btn-clear-col">Clear</button>
</div>

<div>
<label class="column-label">03. ont-srvprofile</label>
<textarea id="in_srv" class="column-text border-heavy h-48"></textarea>
<button onclick="clearField('in_srv',this)" class="btn-clear-col">Clear</button>
</div>

<div>
<label class="column-label">04. ont-lineprofile</label>
<textarea id="in_line" class="column-text border-heavy h-48"></textarea>
<button onclick="clearField('in_line',this)" class="btn-clear-col">Clear</button>
</div>

<div>
<label class="column-label">05. interface_gpon</label>
<textarea id="in_combined" class="column-text border-heavy h-48"></textarea>
<button onclick="clearField('in_combined',this)" class="btn-clear-col">Clear</button>
</div>

<div class="flex flex-col justify-end">
<label class="font-bold text-center text-sm mb-2">New PON (f/s/p)</label>
<input id="in_newpon" type="text" class="border-2 border-black p-2 text-center mono-font">
<button onclick="processData()" class="mt-3 bg-black text-white py-3 font-bold">Generate</button>
</div>

</div>

<h2 class="font-bold mb-4">Output data untuk OLT After:</h2>

<div class="grid grid-cols-3 gap-6">

<div class="output-card">
<div class="output-header">
<span class="output-title">01. output ont-srvprofile</span>
<button onclick="copyCol('res_srv',this)" class="btn-copy-custom">COPY</button>
</div>
<div id="res_srv" class="result-area"></div>
</div>

<div class="output-card">
<div class="output-header">
<span class="output-title">02. output ont-lineprofile</span>
<button onclick="copyCol('res_line',this)" class="btn-copy-custom">COPY</button>
</div>
<div id="res_line" class="result-area"></div>
</div>

<div class="output-card">
<div class="output-header">
<span class="output-title">03. output interface_gpon</span>
<button onclick="copyCol('res_merged',this)" class="btn-copy-custom">COPY</button>
</div>
<div id="res_merged" class="result-area"></div>
</div>

</div>

</div>

<script>
function animateButton(btn,text){
const original=btn.textContent;
btn.classList.add("success");
btn.textContent=text;
setTimeout(()=>{
btn.classList.remove("success");
btn.textContent=original;
},1000);
}

function clearField(id,btn){
document.getElementById(id).value="";
animateButton(btn,"CLEARED ✓");
}

function copyCol(id,btn){
const text=document.getElementById(id).textContent;
if(!text)return;
navigator.clipboard.writeText(text).then(()=>{
animateButton(btn,"DONE ✓");
});
}

function extractMap(text,mapObj,isTraffic=false){
if(!text)return;
const regex=isTraffic?
/ip index\s+(\d+).*?name\s+"([^"]+)"/g:
/profile-id\s+(\d+).*?profile-name\s+"([^"]+)"/g;
let match;
while((match=regex.exec(text))!==null){
mapObj[match[1]]=match[2];
}
}

function processData(){
try{
const newPon=document.getElementById('in_newpon').value.trim();
if(!newPon.includes('/'))return alert("Format PON salah!");
const [f,s,p]=newPon.split('/');
const newFS=`${f}/${s}`;

const rawTcont=document.getElementById('in_tcont').value.split('\n');
const rawTraffic=document.getElementById('in_traffic').value.split('\n');
const rawSrv=document.getElementById('in_srv').value.split('\n');
const rawLine=document.getElementById('in_line').value.split('\n');
const combinedData=document.getElementById('in_combined').value.split('\n');

let dbaMap={},srvMap={},lineMap={},trafficMap={};

rawTcont.forEach(l=>extractMap(l,dbaMap));
rawTraffic.forEach(l=>extractMap(l,trafficMap,true));
rawSrv.forEach(l=>extractMap(l,srvMap));
rawLine.forEach(l=>extractMap(l,lineMap));

document.getElementById('res_srv').textContent=rawSrv.join('\n');
document.getElementById('res_line').textContent=rawLine.join('\n');
document.getElementById('res_merged').textContent=combinedData.join('\n');

alert("Proses Berhasil!");
}
catch(e){
alert("Terjadi kesalahan proses!");
console.error(e);
}
}
</script>

</body>
</html>
