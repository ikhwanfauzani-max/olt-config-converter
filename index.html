<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLT Huawei Rehoming PON Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .mono-font { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-weight: 500; }
        
        .column-text { @apply w-full text-[10px] leading-[1.3] outline-none p-2 transition-all mono-font; }
        .column-label { @apply block text-[11px] font-bold mb-1 text-slate-800 tracking-tight text-center; }
        .border-heavy { @apply border-2 border-slate-900 focus:border-red-600 focus:ring-2 focus:ring-red-100 rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]; }
        .input-fill { @apply bg-white text-slate-900 focus:bg-red-50; }
        
        .output-card { 
            @apply bg-white border-2 border-slate-800 flex flex-col min-h-[500px] shadow-[4px_4px_0px_0px_rgba(0,0,0,0.6)];
        }

        /* HEADER OUTPUT - SOFT HIGH CONTRAST */
        .output-header {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            @apply px-3 py-2 flex justify-between items-center border-b-2 border-slate-800;
        }

        .output-title {
            color: #f1f5f9;
            @apply text-[11px] font-semibold tracking-wide;
        }

        .result-area { 
            @apply flex-grow overflow-both whitespace-pre p-2 text-slate-900 mono-font; 
            background-color: #f8fafc;
            font-size: 10px;
        }

        .btn-copy {
            background-color: #eab308 !important;
            @apply text-slate-900 text-[10px] px-3 py-1 font-bold border-2 border-slate-800 transition-all shadow-[1px_1px_0px_0px_rgba(0,0,0,0.7)];
        }

        .btn-copy:hover {
            background-color: #facc15 !important;
        }

        .btn-clear-col { 
            @apply mt-2 w-full text-[9px] font-bold text-slate-400 hover:text-white hover:bg-slate-800 border border-slate-300 hover:border-slate-900 py-1 transition-all; 
        }

        .reminder-box { 
            background-color: #dbeafe; 
            @apply mb-6 border-l-8 border-blue-600 p-4 shadow-[4px_4px_0px_0px_rgba(0,0,0,0.6)] border-2 border-slate-900; 
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { @apply bg-slate-200; }
        ::-webkit-scrollbar-thumb { @apply bg-slate-700; }
    </style>
</head>
<body class="bg-[#f0f2f5] p-4 md:p-8">
    <div class="max-w-[100%] mx-auto">
        <div class="flex justify-start items-center mb-6 border-b-4 border-slate-900 pb-4 text-slate-900">
            <h1 class="text-2xl font-bold">Olt Huawei <span class="text-red-600">Rehoming Tools</span></h1>
        </div>

        <div class="reminder-box">
            <p class="text-sm font-semibold text-blue-900 italic">
                ℹ️ Reminder: <span class="text-blue-700 font-bold underline uppercase">Pastikan VLAN OLT BEFORE sudah di create di OLT AFTER</span> sebelum eksekusi!
            </p>
        </div>

        <!-- SELURUH HTML & JAVASCRIPT DI BAWAH INI TIDAK DIUBAH -->
