<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLT Huawei Rehoming PON Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .column-text { 
            font-family: 'JetBrains Mono', monospace;
            @apply w-full text-[7px] leading-[1.2] outline-none p-2 transition-all font-bold; 
        }
        /* Label Judul: Ketebalan dikurangi ke Bold (700) */
        .column-label { 
            @apply block text-[11px] font-bold mb-1 uppercase text-slate-800 tracking-tight text-center; 
        }
        .border-heavy { 
            @apply border-2 border-slate-900 focus:border-red-600 focus:ring-2 focus:ring-red-100 rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]; 
        }
        .input-fill { @apply bg-white text-slate-900 focus:bg-red-50; }
        .output-card { 
            @apply bg-white border-2 border-slate-900 flex flex-col min-h-[500px] shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]; 
        }
        .result-area { 
            font-family: 'JetBrains Mono', monospace;
            @apply flex-grow overflow-both whitespace-pre bg-[#fdfdfd] text-[7px] text-slate-900 p-2 font-bold; 
        }
        /* Tombol Clear: Ketebalan dikurangi */
        .btn-clear-col {
            @apply mt-2 w-full text-[9px] font-bold text-slate-500 hover:text-white hover:bg-slate-800 border border-slate-400 hover:border-slate-900 py-1 transition-all uppercase;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { @apply bg-slate-200; }
        ::-webkit-scrollbar-thumb { @apply bg-slate-900; }
    </style>
</head>
<body class="bg-[#f0f2f5] p-4 md:p-8">
    <div class="max-w-[100%] mx-auto">
        <div class="flex justify-between items-center mb-8 border-b-4 border-slate-900 pb-4">
            <div class="flex items-center gap-4">
                <div class="border-2 border-slate-900 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] bg-white overflow-hidden">
                    <img src="logo.jpg" alt="Huawei Logo" class="w-[60px] h-[60px] object-cover" onerror="this.src='https://via.placeholder.com/60?text=LOGO'">
                </div>
                <div class="text-left">
                    <h1 class="text-2xl font-[900] text-slate-900 uppercase tracking-tighter leading-none">OLT Huawei <span class="text-red-600">Rehoming Tools</span></h1>
                </div>
            </div>
            <button onclick="clearAll()" class="text-[10px] font-bold text-white bg-slate-900 hover:bg-red-600 px-4 py-2 border-2 border-slate-900 transition-all uppercase shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">Reset All Data</button>
        </div>

        <div class="mb-4">
            <h2 class="text-lg font-[900] text-red-600 uppercase tracking-tighter border-l-4 border-red-600 pl-3">Input data dari OLT Before :</h2>
        </div>

        <div class="grid grid-cols-7 gap-4 mb-8">
            <div class="flex flex-col">
                <label class="column-label">01. dba_profile</label>
                <textarea id="in_tcont" class="column-text border-heavy input-fill h-48"></textarea>
                <button onclick="clearField('in_tcont')" class="btn-clear-col">Clear</button>
            </div>
            <div class="flex flex-col">
                <label class="column-label">02. traffic_profile</label>
                <textarea id="in_traffic" class="column-text border-heavy input-fill h-48"></textarea>
                <button onclick="clearField('in_traffic')" class="btn-clear-col">Clear</button>
            </div>
            <div class="flex flex-col">
                <label class="column-label">03. service_profile</label>
                <textarea id="in_srv" class="column-text border-heavy input-fill h-48"></textarea>
                <button onclick="clearField('in_srv')" class="btn-clear-col">Clear</button>
            </div>
            <div class="flex flex-col">
                <label class="column-label">04. line_profile</label>
                <textarea id="in_line" class="column-text border-heavy input-fill h-48"></textarea>
                <button onclick="clearField('in_line')" class="btn-clear-col">Clear</button>
            </div>
            <div class="flex flex-col">
                <label class="column-label">05. interface_gpon</label>
                <textarea id="in_if" class="column-text border-heavy input-fill h-48"></textarea>
                <button onclick="clearField('in_if')" class="btn-clear-col">Clear</button>
            </div>
            <div class="flex flex-col">
                <label class="column-label">06. service_port</label>
                <textarea id="in_sp" class="column-text border-heavy input-fill h-48"></textarea>
                <button onclick="clearField('in_sp')" class="btn-clear-col">Clear</button>
            </div>
            
            <div class="flex flex-col justify-end">
                <div class="bg-red-600 p-4 border-2 border-slate-900 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                    <label class="block text-[10px] font-bold text-white uppercase mb-2 text-center">New PON (F/S/P)</label>
                    <input id="in_newpon" type="text" class="w-full font-mono text-[14px] border-2 border-slate-900 p-2 mb-3 text-center font-bold focus:bg-white outline-none" placeholder="0/2/2">
                    <button onclick="processData()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 shadow-md transition-all uppercase text-[12px] tracking-widest">Generate</button>
                </div>
                <div class="h-[34px]"></div>
            </div>
        </div>

        <div class="mb-4">
            <h2 class="text-lg font-[900] text-slate-900 uppercase tracking-tighter border-l-4 border-slate-900 pl-3">Output data untuk OLT After :</h2>
        </div>

        <div class="grid grid-cols-4 gap-6">
            <div class="output-card">
                <div class="flex justify-between items-center bg-slate-900 px-3 py-2">
                    <span class="text-[10px] font-bold text-white uppercase tracking-wider">01. Service Profile</span>
                    <button onclick="copyCol('res_srv')" class="bg-red-600 hover:bg-red-500 text-white text-[9px] px-3 py-1 font-bold border border-white transition-all">COPY</button>
                </div>
                <div id="res_srv" class="result-area"></div>
            </div>
            <div class="output-card">
                <div class="flex justify-between items-center bg-slate-900 px-3 py-2">
                    <span class="text-[10px] font-bold text-white uppercase tracking-wider">02. Line Profile</span>
                    <button onclick="copyCol('res_line')" class="bg-red-600 hover:bg-red-500 text-white text-[9px] px-3 py-1 font-bold border border-white transition-all">COPY</button>
                </div>
                <div id="res_line" class="result-area"></div>
            </div>
            <div class="output-card">
                <div class="flex justify-between items-center bg-slate-900 px-3 py-2">
                    <span class="text-[10px] font-bold text-white uppercase tracking-wider">03. Interface GPON</span>
                    <button onclick="copyCol('res_if')" class="bg-red-600 hover:bg-red-500 text-white text-[9px] px-3 py-1 font-bold border border-white transition-all">COPY</button>
                </div>
                <div id="res_if" class="result-area"></div>
            </div>
            <div class="output-card">
                <div class="flex justify-between items-center bg-slate-900 px-3 py-2">
                    <span class="text-[10px] font-bold text-white uppercase tracking-wider">04. Service Port</span>
                    <button onclick="copyCol('res_sp')" class="bg-red-600 hover:bg-red-500 text-white text-[9px] px-3 py-1 font-bold border border-white transition-all">COPY</button>
                </div>
                <div id="res_sp" class="result-area"></div>
            </div>
        </div>
    </div>

    <script>
        function clearField(id) { document.getElementById(id).value = ''; }
        function extractMap(text, mapObj, isTraffic = false) {
            if (!text) return;
            const regex = isTraffic ? /ip index\s+(\d+).*?name\s+"([^"]+)"/g : /profile-id\s+(\d+).*?profile-name\s+"([^"]+)"/g;
            let match;
            while ((match = regex.exec(text)) !== null) { mapObj[match[1]] = match[2]; }
        }
        function processData() {
            try {
                const newPon = document.getElementById('in_newpon').value.trim();
                if (!newPon.includes('/')) return alert("Format PON salah!");
                const [f, s, p] = newPon.split('/');
                const newFS = `${f}/${s}`;
                const getLines = (id) => document.getElementById(id).value.split('\n');
                const rawTcont = getLines('in_tcont');
                const rawTraffic = getLines('in_traffic');
                const rawSrv = getLines('in_srv');
                const rawLine = getLines('in_line');
                const rawIf = getLines('in_if');
                const rawSp = getLines('in_sp');
                let dbaMap = {}, srvMap = {}, lineMap = {}, trafficMap = {};
                rawTcont.forEach(l => extractMap(l, dbaMap));
                rawTraffic.forEach(l => extractMap(l, trafficMap, true));
                rawSrv.forEach(l => extractMap(l, srvMap));
                rawLine.forEach(l => extractMap(l, lineMap));
                document.getElementById('res_srv').textContent = rawSrv.map(t => t.trim() ? t.replace(/(ont-srvprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ') : "").join('\n');
                document.getElementById('res_line').textContent = rawLine.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/(ont-lineprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ');
                    return txt.replace(/dba-profile-id\s+(\d+)/g, (m, id) => `dba-profile-name ${dbaMap[id] || id}`);
                }).join('\n');
                document.getElementById('res_if').textContent = rawIf.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/interface gpon \d+\/\d+/g, `interface gpon ${newFS}`).replace(/\bport\s+\d+\b/g, `port ${p}`);
                    txt = txt.replace(/ont (add|ipconfig|tr069-server-config|wan-config) \d+/g, `ont $1 ${p}`);
                    txt = txt.replace(/ont port ([a-z\-]+) \d+/g, `ont port $1 ${p}`);
                    txt = txt.replace(/\d+\/\d+\/\d+:/g, `${newPon}:`).replace(/ont-lineprofile-id\s+(\d+)/g, (m, id) => `ont-lineprofile-name ${lineMap[id] || id}`);
                    return txt.replace(/ont-srvprofile-id\s+(\d+)/g, (m, id) => `ont-srvprofile-name ${srvMap[id] || id}`);
                }).join('\n');
                document.getElementById('res_sp').textContent = rawSp.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/service-port\s+\d+/g, 'service-port').replace(/gpon\s+\d+\/\d+\/\d+/g, `gpon ${newPon}`);
                    txt = txt.replace(/traffic-table index\s+(\d+)/g, (m, id) => `traffic-table name ${trafficMap[id] || id}`);
                    return txt.replace(/port desc \d+\/\d+\/\d+/g, `port desc ${newPon}`).replace(/description\s+"(\d+\/\d+\/\d+)_/g, `description "${newPon}_`);
                }).join('\n');
                alert("Berhasil!");
            } catch (e) { alert("Error!"); }
        }
        function clearAll() {
            if (confirm("Hapus semua data?")) {
                ['in_tcont', 'in_traffic', 'in_srv', 'in_line', 'in_if', 'in_sp', 'res_srv', 'res_line', 'res_if', 'res_sp'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el.tagName === 'TEXTAREA') el.value = '';
                    else el.textContent = '';
                });
            }
        }
        function copyCol(id) {
            const text = document.getElementById(id).textContent;
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'DONE!';
                btn.classList.add('bg-green-600');
                setTimeout(() => { btn.textContent = originalText; btn.classList.remove('bg-green-600'); }, 1000);
            });
        }
    </script>
</body>
</html>
