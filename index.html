<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huawei OLT Converter - Light Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tema Terang */
        .input-label { @apply block text-[11px] font-bold mb-1 uppercase text-slate-700 tracking-wide; }
        .text-box { @apply w-full bg-white border border-slate-300 rounded p-2 font-mono text-[10px] outline-none focus:border-blue-500 text-slate-800 shadow-sm; }
        .result-container { @apply w-full bg-slate-50 border border-slate-200 rounded font-mono text-[10px] text-blue-700 h-[400px] overflow-both whitespace-pre p-2 shadow-inner; }
    </style>
</head>
<body class="bg-slate-100 p-4">
    <div class="max-w-[100%] mx-auto">
        <h1 class="text-xl font-bold text-slate-800 mb-6 border-b border-slate-300 pb-2 text-center">HUAWEI REHOMING GENERATOR (LIGHT MODE)</h1>

        <div class="grid grid-cols-7 gap-2 mb-6">
            <div><label class="input-label text-blue-600">Tcont Profile</label><textarea id="in_tcont" class="text-box h-32" placeholder="Paste tcont_profile..."></textarea></div>
            <div><label class="input-label text-blue-600">Traffic Profile</label><textarea id="in_traffic" class="text-box h-32" placeholder="Paste traffic_profile..."></textarea></div>
            <div><label class="input-label text-blue-600">Service Profile</label><textarea id="in_srv" class="text-box h-32" placeholder="Paste service_profile..."></textarea></div>
            <div><label class="input-label text-blue-600">Line Profile</label><textarea id="in_line" class="text-box h-32" placeholder="Paste line_profile..."></textarea></div>
            <div><label class="input-label text-orange-600">Interface GPON</label><textarea id="in_if" class="text-box h-32" placeholder="Paste interface_gpon..."></textarea></div>
            <div><label class="input-label text-orange-600">Service Port</label><textarea id="in_sp" class="text-box h-32" placeholder="Paste service_port..."></textarea></div>
            <div>
                <label class="input-label text-red-600">New PON (F/S/P)</label>
                <input id="in_newpon" type="text" class="text-box mb-2" placeholder="Contoh: 0/2/2">
                <button onclick="processData()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded shadow-md transition-all border border-blue-700 uppercase text-xs">GENERATE</button>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2 border-t border-slate-300 pt-4">
            <div class="flex flex-col">
                <div class="flex justify-between items-center mb-1">
                    <span class="input-label text-emerald-700">service_profile_result</span>
                    <button onclick="copyCol('res_srv')" class="bg-emerald-600 hover:bg-emerald-700 text-[9px] px-2 py-1 rounded text-white font-bold shadow">COPY</button>
                </div>
                <div id="res_srv" class="result-container"></div>
            </div>

            <div class="flex flex-col">
                <div class="flex justify-between items-center mb-1">
                    <span class="input-label text-emerald-700">line_profile_result</span>
                    <button onclick="copyCol('res_line')" class="bg-emerald-600 hover:bg-emerald-700 text-[9px] px-2 py-1 rounded text-white font-bold shadow">COPY</button>
                </div>
                <div id="res_line" class="result-container"></div>
            </div>

            <div class="flex flex-col">
                <div class="flex justify-between items-center mb-1">
                    <span class="input-label text-emerald-700">interface_gpon_result</span>
                    <button onclick="copyCol('res_if')" class="bg-emerald-600 hover:bg-emerald-700 text-[9px] px-2 py-1 rounded text-white font-bold shadow">COPY</button>
                </div>
                <div id="res_if" class="result-container"></div>
            </div>

            <div class="flex flex-col">
                <div class="flex justify-between items-center mb-1">
                    <span class="input-label text-emerald-700">service_port_result</span>
                    <button onclick="copyCol('res_sp')" class="bg-emerald-600 hover:bg-emerald-700 text-[9px] px-2 py-1 rounded text-white font-bold shadow">COPY</button>
                </div>
                <div id="res_sp" class="result-container"></div>
            </div>
        </div>
    </div>

    <script>
        function extractMap(text, mapObj, isTraffic = false) {
            if (!text) return;
            const regex = isTraffic ? /ip index\s+(\d+).*?name\s+"([^"]+)"/g : /profile-id\s+(\d+).*?profile-name\s+"([^"]+)"/g;
            let match;
            while ((match = regex.exec(text)) !== null) { mapObj[match[1]] = match[2]; }
        }

        function processData() {
            try {
                const newPon = document.getElementById('in_newpon').value.trim();
                if (!newPon.includes('/')) return alert("Isi New PON (Format: F/S/P)!");
                const [f, s, p] = newPon.split('/');
                const newFS = `${f}/${s}`;

                const rawTcont = document.getElementById('in_tcont').value.split('\n');
                const rawTraffic = document.getElementById('in_traffic').value.split('\n');
                const rawSrv = document.getElementById('in_srv').value.split('\n');
                const rawLine = document.getElementById('in_line').value.split('\n');
                const rawIf = document.getElementById('in_if').value.split('\n');
                const rawSp = document.getElementById('in_sp').value.split('\n');

                let dbaMap = {}, srvMap = {}, lineMap = {}, trafficMap = {};
                rawTcont.forEach(l => extractMap(l, dbaMap));
                rawTraffic.forEach(l => extractMap(l, trafficMap, true));
                rawSrv.forEach(l => extractMap(l, srvMap));
                rawLine.forEach(l => extractMap(l, lineMap));

                document.getElementById('res_srv').textContent = rawSrv.map(t => 
                    t.trim() ? t.replace(/(ont-srvprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ') : ""
                ).join('\n');

                document.getElementById('res_line').textContent = rawLine.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/(ont-lineprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ');
                    return txt.replace(/dba-profile-id\s+(\d+)/g, (m, id) => `dba-profile-name ${dbaMap[id] || id}`);
                }).join('\n');

                document.getElementById('res_if').textContent = rawIf.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/interface gpon \d+\/\d+/g, `interface gpon ${newFS}`);
                    txt = txt.replace(/\bport\s+\d+\b/g, `port ${p}`);
                    txt = txt.replace(/ont (add|ipconfig|tr069-server-config) \d+/g, `ont $1 ${p}`);
                    txt = txt.replace(/ont port ([a-z\-]+) \d+/g, `ont port \1 ${p}`);
                    txt = txt.replace(/\d+\/\d+\/\d+:/g, `${newPon}:`);
                    txt = txt.replace(/ont-lineprofile-id\s+(\d+)/g, (m, id) => `ont-lineprofile-name ${lineMap[id] || id}`);
                    txt = txt.replace(/ont-srvprofile-id\s+(\d+)/g, (m, id) => `ont-srvprofile-name ${srvMap[id] || id}`);
                    return txt;
                }).join('\n');

                document.getElementById('res_sp').textContent = rawSp.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/service-port\s+\d+/g, 'service-port');
                    txt = txt.replace(/gpon\s+\d+\/\d+\/\d+/g, `gpon ${newPon}`);
                    txt = txt.replace(/traffic-table index\s+(\d+)/g, (m, id) => `traffic-table name ${trafficMap[id] || id}`);
                    txt = txt.replace(/port desc \d+\/\d+\/\d+/g, `port desc ${newPon}`);
                    txt = txt.replace(/description\s+"(\d+\/\d+\/\d+)_/g, `description "${newPon}_`);
                    return txt;
                }).join('\n');

                alert("Generate Berhasil!");
            } catch (e) { alert("Error: " + e.message); }
        }

        function copyCol(id) {
            const text = document.getElementById(id).textContent;
            if(!text) return alert("Data kosong!");
            navigator.clipboard.writeText(text).then(() => alert("Copied!"));
        }
    </script>
</body>
</html>
