<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLT Huawei Rehoming PON Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .mono-font { font-family: 'Consolas', monospace; font-weight: 500; }
        .column-text { @apply w-full text-[10px] leading-[1.3] outline-none p-2 transition-all mono-font; }
        .border-heavy { @apply border-2 border-slate-900 rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]; }
        .output-card { @apply bg-white border-2 border-slate-900 flex flex-col min-h-[500px] shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]; }

        /* PERBAIKAN KONTRAS DI SINI */
        .output-header {
            background-color: #1e3a8a !important; /* Biru Tua */
            @apply px-3 py-2 flex justify-between items-center border-b-2 border-slate-900;
        }
        .output-title {
            color: #ffffff !important; /* Putih Bersih */
            @apply text-[11px] font-black tracking-tight;
            text-transform: none;
        }
        .btn-copy {
            background-color: #facc15 !important; /* Kuning Stabilo */
            @apply text-slate-900 text-[10px] px-4 py-1 font-black border-2 border-slate-900 shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] uppercase;
        }
        .result-area { @apply flex-grow overflow-both whitespace-pre p-2 text-slate-900 mono-font bg-[#f8fafc] text-[10px]; }
    </style>
</head>
<body class="bg-[#f0f2f5] p-8">
    <div class="max-w-[100%] mx-auto">
        
        <div class="mb-6 border-b-4 border-slate-900 pb-4 flex items-center gap-4">
            <h1 class="text-2xl font-bold text-slate-900">Olt Huawei <span class="text-red-600">Rehoming Tools</span></h1>
        </div>

        <h2 class="text-lg font-bold text-slate-900 mb-4 border-l-4 border-slate-900 pl-3">Output data untuk Olt After :</h2>

        <div class="grid grid-cols-3 gap-6">
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">01. output ont-srvprofile</span>
                    <button class="btn-copy">Copy</button>
                </div>
                <div class="result-area"></div>
            </div>
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">02. output ont-lineprofile</span>
                    <button class="btn-copy">Copy</button>
                </div>
                <div class="result-area"></div>
            </div>
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">03. output interface_gpon</span>
                    <button class="btn-copy">Copy</button>
                </div>
                <div class="result-area"></div>
            </div>
        </div>
    </div>
</body>
</html>
