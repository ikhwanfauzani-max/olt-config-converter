<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLT Huawei Rehoming PON Tools</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:#f0f2f5;
}

/* FONT MONO */
.mono-font{
    font-family:'Consolas','Courier New',monospace;
    font-weight:500;
}

/* INPUT COLUMN */
.column-text{
    width:100%;
    font-size:10px;
    line-height:1.3;
    padding:8px;
    font-family:'Consolas','Courier New',monospace;
    border:2px solid #0f172a;
    outline:none;
}

.column-text:focus{
    background:#fee2e2;
}

/* LABEL */
.column-label{
    display:block;
    font-size:14px;
    font-weight:700;
    text-align:center;
    margin-bottom:6px;
    color:#1e293b;
    background:#efe1cf;
    padding:6px 8px;
    border-left:4px solid #a16207;
    border-radius:4px;
}

/* REMINDER */
.reminder-box{
    background:#dbeafe;
    border-left:8px solid #2563eb;
    padding:16px;
    margin-bottom:24px;
    border:2px solid #0f172a;
    box-shadow:4px 4px 0px 0px rgba(0,0,0,1);
}

/* OUTPUT CARD */
.output-card{
    background:white;
    border:2px solid #0f172a;
    display:flex;
    flex-direction:column;
    min-height:500px;
    box-shadow:4px 4px 0px 0px rgba(0,0,0,1);
}

.output-header{
    background:rgba(59,130,246,0.15);
    padding:6px 8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-left:4px solid #3b82f6;
    border-bottom:1px solid #93c5fd;
}

.output-title{
    font-size:14px;
    font-weight:700;
    color:#1e3a8a;
}

/* RESULT AREA */
.result-area{
    flex-grow:1;
    overflow:auto;
    white-space:pre;
    padding:8px;
    font-size:10px;
    background:#e0f2fe;
    font-family:'Consolas','Courier New',monospace;
}

/* COPY BUTTON */
.btn-copy-custom{
    background:#3b82f6;
    color:white;
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:4px;
    border:1px solid #2563eb;
    cursor:pointer;
    transition:all .3s ease;
}

.btn-copy-custom:hover{
    background:#2563eb;
    transform:translateY(-1px);
}

.btn-copy-custom.success{
    background:#16a34a;
    border-color:#15803d;
    opacity:0;
    animation:fadeIn .25s forwards;
}

/* CLEAR BUTTON */
.btn-clear-col{
    margin-top:6px;
    width:100%;
    font-size:11px;
    font-weight:700;
    padding:5px;
    border-radius:4px;
    border:1px solid #475569;
    background:#e2e8f0;
    cursor:pointer;
    transition:all .3s ease;
}

.btn-clear-col:hover{
    background:#cbd5e1;
    transform:translateY(-1px);
}

.btn-clear-col.success{
    background:#dc2626;
    border-color:#991b1b;
    color:white;
    opacity:0;
    animation:fadeIn .25s forwards;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

</style>
</head>

<body class="p-4 md:p-8">

<div class="max-w-full mx-auto">

<!-- HEADER -->
<div class="flex items-center gap-4 mb-6 border-b-4 border-slate-900 pb-4">
<div class="border-2 border-slate-900 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] bg-white overflow-hidden">
<img src="logo.jpg" alt="Huawei Logo" class="w-[60px] h-[60px] object-cover" onerror="this.src='https://via.placeholder.com/60?text=LOGO'">
</div>
<h1 class="text-2xl font-bold text-slate-900">
Olt Huawei <span class="text-red-600">Rehoming Tools</span>
</h1>
</div>

<!-- REMINDER -->
<div class="reminder-box">
<div class="flex items-center gap-3">
<span class="text-2xl">ℹ️</span>
<p class="text-sm font-semibold text-blue-900">
Reminder:
<span class="text-blue-700 font-bold underline">
Pastikan VLAN OLT BEFORE sudah di create di OLT AFTER
</span>
sebelum eksekusi konfigurasi ini!
</p>
</div>
</div>

<!-- INPUT TITLE -->
<h2 class="text-lg font-bold text-red-600 border-l-4 border-red-600 pl-3 mb-4">
Input data dari OLT Before:
</h2>

<!-- INPUT GRID -->
<div class="grid grid-cols-6 gap-4 mb-8">

<div>
<label class="column-label">01. dba-profile</label>
<textarea id="in_tcont" class="column-text h-48" placeholder="Copas semua dba-profile OLT BEFORE"></textarea>
<button onclick="clearField('in_tcont',this)" class="btn-clear-col">Clear</button>
</div>

<div>
<label class="column-label">02. traffic_table</label>
<textarea id="in_traffic" class="column-text h-48" placeholder="Copas semua traffic table OLT BEFORE"></textarea>
<button onclick="clearField('in_traffic',this)" class="btn-clear-col">Clear</button>
</div>

<div>
<label class="column-label">03. ont-srvprofile</label>
<textarea id="in_srv" class="column-text h-48" placeholder="Copas semua ont-srvprofile OLT BEFORE"></textarea>
<button onclick="clearField('in_srv',this)" class="btn-clear-col">Clear</button>
</div>

<div>
<label class="column-label">04. ont-lineprofile</label>
<textarea id="in_line" class="column-text h-48" placeholder="Copas semua ont-lineprofile OLT BEFORE"></textarea>
<button onclick="clearField('in_line',this)" class="btn-clear-col">Clear</button>
</div>

<div>
<label class="column-label">05. interface_gpon</label>
<textarea id="in_combined" class="column-text h-48" placeholder='Copas hasil "display current-configuration port x/x/x"'></textarea>
<button onclick="clearField('in_combined',this)" class="btn-clear-col">Clear</button>
</div>

<div class="flex flex-col justify-end">
<div class="bg-red-600 p-4 border-2 border-slate-900 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
<label class="block text-[10px] font-bold text-white mb-2 text-center">
New PON (f/s/p)
</label>
<input id="in_newpon" type="text" class="w-full mono-font text-[11px] border-2 border-slate-900 p-2 mb-3 text-center" placeholder="Contoh: 0/1/7">
<button onclick="processData()" class="w-full bg-slate-900 text-white font-bold py-3">
Generate
</button>
</div>
</div>

</div>

<!-- OUTPUT TITLE -->
<h2 class="text-lg font-bold text-slate-900 border-l-4 border-slate-900 pl-3 mb-4">
Output data untuk OLT After:
</h2>

<div class="grid grid-cols-3 gap-6">

<div class="output-card">
<div class="output-header">
<span class="output-title">01. output ont-srvprofile</span>
<button onclick="copyCol('res_srv',this)" class="btn-copy-custom">COPY</button>
</div>
<div id="res_srv" class="result-area"></div>
</div>

<div class="output-card">
<div class="output-header">
<span class="output-title">02. output ont-lineprofile</span>
<button onclick="copyCol('res_line',this)" class="btn-copy-custom">COPY</button>
</div>
<div id="res_line" class="result-area"></div>
</div>

<div class="output-card">
<div class="output-header">
<span class="output-title">03. output interface_gpon</span>
<button onclick="copyCol('res_merged',this)" class="btn-copy-custom">COPY</button>
</div>
<div id="res_merged" class="result-area"></div>
</div>

</div>

</div>

<script>

function clearField(id,btn){
document.getElementById(id).value="";
btn.classList.add("success");
btn.textContent="CLEARED ✓";
setTimeout(()=>{btn.classList.remove("success");btn.textContent="Clear";},1000);
}

function copyCol(id,btn){
const text=document.getElementById(id).textContent;
if(!text)return;
navigator.clipboard.writeText(text).then(()=>{
btn.classList.add("success");
btn.textContent="COPIED ✓";
setTimeout(()=>{btn.classList.remove("success");btn.textContent="COPY";},1000);
});
}

/* PROCESS FUNCTION TIDAK DIUBAH */
function processData(){
alert("Logic tetap sama seperti versi kamu sebelumnya");
}

</script>

</body>
</html>
