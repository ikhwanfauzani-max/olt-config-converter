<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLT Huawei Rehoming PON Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .mono-font { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; font-weight: 500; }
        
        /* Input Styling */
        .column-text { @apply w-full text-[10px] leading-[1.3] outline-none p-2 transition-all mono-font; }
        .column-label { @apply block text-[11px] font-bold mb-1 text-slate-800 tracking-tight text-center; }
        .border-heavy { @apply border-2 border-slate-900 focus:border-red-600 focus:ring-2 focus:ring-red-100 rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]; }
        .input-fill { @apply bg-white text-slate-900 focus:bg-red-50; }
        
        /* Output Styling */
        .output-card { @apply bg-white border-2 border-slate-900 flex flex-col min-h-[500px] shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]; }
        
        /* HEADER OUTPUT: ORANGE MUDA */
        .output-header {
            background-color: #fbbf24 !important; /* Orange/Amber Muda */
            @apply px-3 py-2 flex justify-between items-center border-b-2 border-slate-900;
        }

        /* TEKS JUDUL: HITAM BOLD */
        .output-title {
            color: #000000 !important; 
            @apply text-[11px] font-black tracking-tight;
            text-transform: none; 
        }

        .result-area { 
            @apply flex-grow overflow-both whitespace-pre p-2 text-slate-900 mono-font; 
            background-color: #ffffff;
            font-size: 10px;
        }

        /* TOMBOL COPY: BIRU MUDA + KAPITAL */
        .btn-copy {
            background-color: #38bdf8 !important; /* Biru Muda (Sky-400) */
            @apply text-slate-900 text-[10px] px-3 py-1 font-black border-2 border-slate-900 transition-all shadow-[1px_1px_0px_0px_rgba(0,0,0,1)];
            text-transform: uppercase;
        }
        .btn-copy:hover { @apply bg-sky-500; }

        .btn-clear-col { @apply mt-2 w-full text-[9px] font-bold text-slate-400 hover:text-white hover:bg-slate-800 border border-slate-300 hover:border-slate-900 py-1 transition-all; }
        .reminder-box { background-color: #dbeafe; @apply mb-6 border-l-8 border-blue-600 p-4 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] border-2 border-slate-900; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { @apply bg-slate-200; }
        ::-webkit-scrollbar-thumb { @apply bg-slate-900; }
    </style>
</head>
<body class="bg-[#f0f2f5] p-4 md:p-8">
    <div class="max-w-[100%] mx-auto">
        <div class="flex justify-start items-center mb-6 border-b-4 border-slate-900 pb-4 text-slate-900">
            <h1 class="text-2xl font-bold">Olt Huawei <span class="text-red-600">Rehoming Tools</span></h1>
        </div>

        <div class="reminder-box">
            <p class="text-sm font-semibold text-blue-900 italic">
                ℹ️ Reminder: <span class="text-blue-700 font-bold underline uppercase">Pastikan VLAN OLT BEFORE sudah di create di OLT AFTER</span> sebelum eksekusi!
            </p>
        </div>

        <div class="mb-4">
            <h2 class="text-lg font-bold text-red-600 tracking-tight border-l-4 border-red-600 pl-3 uppercase">Input data dari Olt Before :</h2>
        </div>

        <div class="grid grid-cols-6 gap-4 mb-8">
            <div class="flex flex-col">
                <label class="column-label">01. dba-profile</label>
                <textarea id="in_tcont" class="column-text border-heavy input-fill h-48" placeholder="Copas semua dba-profile OLT BEFORE"></textarea>
                <button onclick="clearField('in_tcont')" class="btn-clear-col">Clear</button>
            </div>
            <div class="flex flex-col">
                <label class="column-label">02. traffic_table</label>
                <textarea id="in_traffic" class="column-text border-heavy input-fill h-48" placeholder="copas semua traffic table ip index OLT BEFORE"></textarea>
                <button onclick="clearField('in_traffic')" class="btn-clear-col">Clear</button>
            </div>
            <div class="flex flex-col">
                <label class="column-label">03. ont-srvprofile</label>
                <textarea id="in_srv" class="column-text border-heavy input-fill h-48" placeholder="Copas ont-srvprofile OLT BEFORE"></textarea>
                <button onclick="clearField('in_srv')" class="btn-clear-col">Clear</button>
            </div>
            <div class="flex flex-col">
                <label class="column-label">04. ont-lineprofile</label>
                <textarea id="in_line" class="column-text border-heavy input-fill h-48" placeholder="Copas ont-lineprofile OLT BEFORE"></textarea>
                <button onclick="clearField('in_line')" class="btn-clear-col">Clear</button>
            </div>
            <div class="flex flex-col">
                <label class="column-label">05. interface_gpon</label>
                <textarea id="in_combined" class="column-text border-heavy input-fill h-48" placeholder='Copas "display current-configuration port x/x/x" PON OLT BEFORE'></textarea>
                <button onclick="clearField('in_combined')" class="btn-clear-col">Clear</button>
            </div>
            
            <div class="flex flex-col justify-end">
                <div class="bg-red-600 p-4 border-2 border-slate-900 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                    <label class="block text-[10px] font-bold text-white mb-2 text-center uppercase">New PON (f/s/p)</label>
                    <input id="in_newpon" type="text" class="w-full mono-font text-[11px] border-2 border-slate-900 p-2 mb-3 text-center outline-none" placeholder="0/1/7">
                    <button onclick="processData()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-4 text-[12px] tracking-widest transition-all uppercase">Generate</button>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <h2 class="text-lg font-bold text-slate-900 tracking-tight border-l-4 border-slate-900 pl-3 uppercase">Output data untuk Olt After :</h2>
        </div>

        <div class="grid grid-cols-3 gap-6">
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">01. output ont-srvprofile</span>
                    <button onclick="copyCol('res_srv')" class="btn-copy">COPY</button>
                </div>
                <div id="res_srv" class="result-area"></div>
            </div>
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">02. output ont-lineprofile</span>
                    <button onclick="copyCol('res_line')" class="btn-copy">COPY</button>
                </div>
                <div id="res_line" class="result-area"></div>
            </div>
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">03. output interface_gpon</span>
                    <button onclick="copyCol('res_merged')" class="btn-copy">COPY</button>
                </div>
                <div id="res_merged" class="result-area"></div>
            </div>
        </div>
    </div>

    <script>
        function clearField(id) { document.getElementById(id).value = ''; }
        function extractMap(text, mapObj, isTraffic = false) {
            if (!text) return;
            const regex = isTraffic ? /ip index\s+(\d+).*?name\s+"([^"]+)"/g : /profile-id\s+(\d+).*?profile-name\s+"([^"]+)"/g;
            let match;
            while ((match = regex.exec(text)) !== null) { mapObj[match[1]] = match[2]; }
        }
        function processData() {
            try {
                const newPon = document.getElementById('in_newpon').value.trim();
                if (!newPon.includes('/')) return alert("Format PON salah!");
                const [f, s, p] = newPon.split('/');
                const newFS = `${f}/${s}`;
                
                const rawTcont = document.getElementById('in_tcont').value.split('\n');
                const rawTraffic = document.getElementById('in_traffic').value.split('\n');
                const rawSrv = document.getElementById('in_srv').value.split('\n');
                const rawLine = document.getElementById('in_line').value.split('\n');
                const combinedData = document.getElementById('in_combined').value.split('\n');
                
                let dbaMap = {}, srvMap = {}, lineMap = {}, trafficMap = {};
                rawTcont.forEach(l => extractMap(l, dbaMap));
                rawTraffic.forEach(l => extractMap(l, trafficMap, true));
                rawSrv.forEach(l => extractMap(l, srvMap));
                rawLine.forEach(l => extractMap(l, lineMap));

                let srvLines = rawSrv.map(t => t.trim() ? t.replace(/(ont-srvprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ') : "").filter(l => l !== "");
                let finalSrv = [];
                srvLines.forEach(line => {
                    finalSrv.push(line);
                    if(line.toLowerCase().includes("commit")) finalSrv.push(" quit");
                });
                document.getElementById('res_srv').textContent = finalSrv.join('\n');

                document.getElementById('res_line').textContent = rawLine.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/(ont-lineprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ');
                    return txt.replace(/dba-profile-id\s+(\d+)/g, (m, id) => `dba-profile-name ${dbaMap[id] || id}`);
                }).join('\n');

                let lastOntPortIndex = -1;
                const outIfLines = combinedData.filter(l => {
                    const line = l.trim();
                    return (line.startsWith('interface gpon') || line.startsWith('ont ') || (line.startsWith('port ') && !line.includes('desc')) || line.startsWith('ont-lineprofile') || line.startsWith('ont-srvprofile')) && !line.includes('service-port');
                }).map(t => {
                    let txt = t.replace(/interface gpon \d+\/\d+/g, `interface gpon ${newFS}`).replace(/\bport\s+\d+\b/g, `port ${p}`);
                    txt = txt.replace(/ont (add|ipconfig|tr069-server-config|wan-config) \d+/g, `ont $1 ${p}`);
                    txt = txt.replace(/ont port ([a-z\-]+) \d+/g, `ont port $1 ${p}`);
                    txt = txt.replace(/\d+\/\d+\/\d+:/g, `${newPon}:`).replace(/ont-lineprofile-id\s+(\d+)/g, (m, id) => `ont-lineprofile-name ${lineMap[id] || id}`);
                    return txt.replace(/ont-srvprofile-id\s+(\d+)/g, (m, id) => `ont-srvprofile-name ${srvMap[id] || id}`);
                });

                for(let i = outIfLines.length - 1; i >= 0; i--) { if(outIfLines[i].includes('ont port')) { lastOntPortIndex = i; break; } }
                if(lastOntPortIndex !== -1) outIfLines.splice(lastOntPortIndex + 1, 0, " quit");

                const outSpAndDesc = combinedData.filter(l => l.includes('service-port') || l.includes('port') && l.includes('desc')).map(t => {
                    let txt = t.trim();
                    if(!txt) return "";
                    txt = txt.replace(/service-port\s+\d+/g, 'service-port').replace(/gpon\s+\d+\/\d+\/\d+/g, `gpon ${newPon}`);
                    txt = txt.replace(/traffic-table index\s+(\d+)/g, (m, id) => `traffic-table name ${trafficMap[id] || id}`);
                    txt = txt.replace(/port\s+desc\s+\d+\/\d+\/\d+/g, `port desc ${newPon}`);
                    txt = txt.replace(/description\s+"(\d+\/\d+\/\d+)_/g, `description "${newPon}_`);
                    return txt;
                }).filter(l => l !== "");

                document.getElementById('res_merged').textContent = (outIfLines.join('\n').trim() + "\n\n" + outSpAndDesc.join('\n').trim()).trim();
                alert("Proses Berhasil!");
            } catch (e) { alert("Terjadi kesalahan proses!"); }
        }
        function copyCol(id) {
            const text = document.getElementById(id).textContent;
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'DONE!';
                btn.style.backgroundColor = '#22c55e';
                btn.style.color = '#ffffff';
                setTimeout(() => { 
                    btn.textContent = originalText; 
                    btn.style.backgroundColor = '#38bdf8'; 
                    btn.style.color = '#000000';
                }, 1000);
            });
        }
    </script>
</body>
</html>
