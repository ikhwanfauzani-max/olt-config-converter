<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLT Huawei Rehoming PON Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Font Mono Tebal untuk data OLT */
        .column-text { 
            font-family: 'JetBrains Mono', monospace;
            @apply w-full text-[7px] leading-[1.2] outline-none p-2 transition-all font-bold; 
        }
        
        /* Label Judul Berangka */
        .column-label { 
            @apply block text-[11px] font-black mb-1 uppercase text-slate-800 tracking-tighter text-center; 
        }

        /* Border Hitam Tegas */
        .border-heavy { 
            @apply border-2 border-slate-900 focus:border-red-600 focus:ring-2 focus:ring-red-100 rounded-none shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]; 
        }

        .input-fill { @apply bg-white text-slate-900 focus:bg-red-50; }

        /* Card Output dengan Border Boxy */
        .output-card { 
            @apply bg-white border-2 border-slate-900 flex flex-col min-h-[500px] shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]; 
        }

        .result-area { 
            font-family: 'JetBrains Mono', monospace;
            @apply flex-grow overflow-both whitespace-pre bg-[#fdfdfd] text-[7px] text-slate-900 p-2 font-bold; 
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { @apply bg-slate-200; }
        ::-webkit-scrollbar-thumb { @apply bg-slate-900; }
    </style>
</head>
<body class="bg-[#f0f2f5] p-4 md:p-8">
    <div class="max-w-[100%] mx-auto">
        <div class="flex justify-between items-center mb-6 border-b-4 border-slate-900 pb-4">
            <div class="flex items-center gap-4">
                <div class="bg-red-600 p-2 border-2 border-slate-900 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                    <svg width="30" height="30" viewBox="0 0 40 40" fill="white" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 0C21.1 0 22 0.9 22 2V6C22 7.1 21.1 8 20 8C18.9 8 18 7.1 18 6V2C18 0.9 18.9 0 20 0ZM28.5 4.5C29.3 3.7 30.6 3.7 31.4 4.5L34.2 7.3C35 8.1 35 9.4 34.2 10.2C33.4 11 32.1 11 31.3 10.2L28.5 7.4C27.7 6.6 27.7 5.3 28.5 4.5ZM35.5 18C36.6 18 37.5 18.9 37.5 20C37.5 21.1 36.6 22 35.5 22H31.5C30.4 22 29.5 21.1 29.5 20C29.5 18.9 30.4 18 31.5 18H35.5ZM31.4 35.5C30.6 36.3 29.3 36.3 28.5 35.5L25.7 32.7C24.9 31.9 24.9 30.6 25.7 29.8C26.5 29 27.8 29 28.6 29.8L31.4 32.6C32.2 33.4 32.2 34.7 31.4 35.5ZM20 40C18.9 40 18 39.1 18 38V34C18 32.9 18.9 32 20 32C21.1 32 22 32.9 22 34V38C22 39.1 21.1 40 20 40ZM8.6 35.5C7.8 36.3 6.5 36.3 5.7 35.5L2.9 32.7C2.1 31.9 2.1 30.6 2.9 29.8C3.7 29 5 29 5.8 29.8L8.6 32.6C9.4 33.4 9.4 34.7 8.6 35.5ZM2.5 20C2.5 18.9 3.4 18 4.5 18H8.5C9.6 18 10.5 18.9 10.5 20C10.5 21.1 9.6 22 8.5 22H4.5C3.4 22 2.5 21.1 2.5 20ZM8.6 4.5C9.4 3.7 10.7 3.7 11.5 4.5L14.3 7.3C15.1 8.1 15.1 9.4 14.3 10.2C13.5 11 12.2 11 11.4 10.2L8.6 7.4C7.8 6.6 7.8 5.3 8.6 4.5Z" />
                    </svg>
                </div>
                <div class="text-left">
                    <h1 class="text-2xl font-[900] text-slate-900 uppercase tracking-tighter leading-none">OLT Huawei <span class="text-red-600">Rehoming Tools</span></h1>
                    <p class="text-[11px] text-slate-600 font-bold uppercase tracking-widest mt-1">Config Converter</p>
                </div>
            </div>
            <button onclick="clearAll()" class="text-[10px] font-black text-white bg-slate-900 hover:bg-red-600 px-4 py-2 border-2 border-slate-900 transition-all uppercase">Clear All Data</button>
        </div>

        <div class="grid grid-cols-7 gap-4 mb-8">
            <div class="flex flex-col"><label class="column-label">01. dba_profile</label><textarea id="in_tcont" class="column-text border-heavy input-fill h-48"></textarea></div>
            <div class="flex flex-col"><label class="column-label">02. traffic_profile</label><textarea id="in_traffic" class="column-text border-heavy input-fill h-48"></textarea></div>
            <div class="flex flex-col"><label class="column-label">03. service_profile</label><textarea id="in_srv" class="column-text border-heavy input-fill h-48"></textarea></div>
            <div class="flex flex-col"><label class="column-label">04. line_profile</label><textarea id="in_line" class="column-text border-heavy input-fill h-48"></textarea></div>
            <div class="flex flex-col"><label class="column-label">05. interface_gpon</label><textarea id="in_if" class="column-text border-heavy input-fill h-48"></textarea></div>
            <div class="flex flex-col"><label class="column-label">06. service_port</label><textarea id="in_sp" class="column-text border-heavy input-fill h-48"></textarea></div>
            
            <div class="flex flex-col justify-end">
                <div class="bg-red-600 p-4 border-2 border-slate-900 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                    <label class="block text-[10px] font-black text-white uppercase mb-2 text-center">New PON (F/S/P)</label>
                    <input id="in_newpon" type="text" class="w-full font-mono text-[14px] border-2 border-slate-900 p-2 mb-3 text-center font-black focus:bg-white outline-none" placeholder="0/2/2">
                    <button onclick="processData()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-4 shadow-md transition-all uppercase text-[12px] tracking-widest">Generate</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-6">
            <div class="output-card">
                <div class="flex justify-between items-center bg-slate-900 px-3 py-2">
                    <span class="text-[10px] font-black text-white uppercase tracking-wider">Output Service Profile</span>
                    <button onclick="copyCol('res_srv')" class="bg-red-600 hover:bg-red-500 text-white text-[9px] px-3 py-1 font-black border border-white transition-all">COPY</button>
                </div>
                <div id="res_srv" class="result-area"></div>
            </div>

            <div class="output-card">
                <div class="flex justify-between items-center bg-slate-900 px-3 py-2">
                    <span class="text-[10px] font-black text-white uppercase tracking-wider">Output Line Profile</span>
                    <button onclick="copyCol('res_line')" class="bg-red-600 hover:bg-red-500 text-white text-[9px] px-3 py-1 font-black border border-white transition-all">COPY</button>
                </div>
                <div id="res_line" class="result-area"></div>
            </div>

            <div class="output-card">
                <div class="flex justify-between items-center bg-slate-900 px-3 py-2">
                    <span class="text-[10px] font-black text-white uppercase tracking-wider">Output Interface GPON</span>
                    <button onclick="copyCol('res_if')" class="bg-red-600 hover:bg-red-500 text-white text-[9px] px-3 py-1 font-black border border-white transition-all">COPY</button>
                </div>
                <div id="res_if" class="result-area"></div>
            </div>

            <div class="output-card">
                <div class="flex justify-between items-center bg-slate-900 px-3 py-2">
                    <span class="text-[10px] font-black text-white uppercase tracking-wider">Output Service Port</span>
                    <button onclick="copyCol('res_sp')" class="bg-red-600 hover:bg-red-500 text-white text-[9px] px-3 py-1 font-black border border-white transition-all">COPY</button>
                </div>
                <div id="res_sp" class="result-area"></div>
            </div>
        </div>

        <footer class="mt-12 text-center pb-8">
            <p class="text-[11px] text-slate-900 uppercase font-black tracking-[0.3em]">HUAWEI OLT REHOMING TOOL &bull; v2.0</p>
        </footer>
    </div>

    <script>
        // Logika script tetap sama seperti sebelumnya (termasuk wan-config)
        function extractMap(text, mapObj, isTraffic = false) {
            if (!text) return;
            const regex = isTraffic ? /ip index\s+(\d+).*?name\s+"([^"]+)"/g : /profile-id\s+(\d+).*?profile-name\s+"([^"]+)"/g;
            let match;
            while ((match = regex.exec(text)) !== null) { mapObj[match[1]] = match[2]; }
        }

        function processData() {
            try {
                const newPon = document.getElementById('in_newpon').value.trim();
                if (!newPon.includes('/')) return alert("Format PON salah!");
                const [f, s, p] = newPon.split('/');
                const newFS = `${f}/${s}`;

                const getLines = (id) => document.getElementById(id).value.split('\n');
                const rawTcont = getLines('in_tcont');
                const rawTraffic = getLines('in_traffic');
                const rawSrv = getLines('in_srv');
                const rawLine = getLines('in_line');
                const rawIf = getLines('in_if');
                const rawSp = getLines('in_sp');

                let dbaMap = {}, srvMap = {}, lineMap = {}, trafficMap = {};
                rawTcont.forEach(l => extractMap(l, dbaMap));
                rawTraffic.forEach(l => extractMap(l, trafficMap, true));
                rawSrv.forEach(l => extractMap(l, srvMap));
                rawLine.forEach(l => extractMap(l, lineMap));

                document.getElementById('res_srv').textContent = rawSrv.map(t => t.trim() ? t.replace(/(ont-srvprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ') : "").join('\n');
                document.getElementById('res_line').textContent = rawLine.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/(ont-lineprofile gpon)\s+profile-id\s+\d+\s+/g, '$1 ');
                    return txt.replace(/dba-profile-id\s+(\d+)/g, (m, id) => `dba-profile-name ${dbaMap[id] || id}`);
                }).join('\n');
                document.getElementById('res_if').textContent = rawIf.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/interface gpon \d+\/\d+/g, `interface gpon ${newFS}`).replace(/\bport\s+\d+\b/g, `port ${p}`);
                    txt = txt.replace(/ont (add|ipconfig|tr069-server-config|wan-config) \d+/g, `ont $1 ${p}`);
                    txt = txt.replace(/ont port ([a-z\-]+) \d+/g, `ont port $1 ${p}`);
                    txt = txt.replace(/\d+\/\d+\/\d+:/g, `${newPon}:`).replace(/ont-lineprofile-id\s+(\d+)/g, (m, id) => `ont-lineprofile-name ${lineMap[id] || id}`);
                    return txt.replace(/ont-srvprofile-id\s+(\d+)/g, (m, id) => `ont-srvprofile-name ${srvMap[id] || id}`);
                }).join('\n');
                document.getElementById('res_sp').textContent = rawSp.map(t => {
                    if(!t.trim()) return "";
                    let txt = t.replace(/service-port\s+\d+/g, 'service-port').replace(/gpon\s+\d+\/\d+\/\d+/g, `gpon ${newPon}`);
                    txt = txt.replace(/traffic-table index\s+(\d+)/g, (m, id) => `traffic-table name ${trafficMap[id] || id}`);
                    return txt.replace(/port desc \d+\/\d+\/\d+/g, `port desc ${newPon}`).replace(/description\s+"(\d+\/\d+\/\d+)_/g, `description "${newPon}_`);
                }).join('\n');

                alert("Konversi Berhasil!");
            } catch (e) { alert("Terjadi Kesalahan!"); }
        }

        function clearAll() {
            if (confirm("Hapus semua data?")) {
                ['in_tcont', 'in_traffic', 'in_srv', 'in_line', 'in_if', 'in_sp', 'res_srv', 'res_line', 'res_if', 'res_sp'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el.tagName === 'TEXTAREA') el.value = '';
                    else el.textContent = '';
                });
            }
        }

        function copyCol(id) {
            const text = document.getElementById(id).textContent;
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'DONE!';
                btn.classList.add('bg-green-600');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('bg-green-600');
                }, 1000);
            });
        }
    </script>
</body>
</html>
